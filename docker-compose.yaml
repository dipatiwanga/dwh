
services:
  # --- Infrastructure: PostgreSQL ---
  postgres:
    image: postgres:15-alpine
    container_name: dwh_postgres
    environment:
      POSTGRES_USER: ${DWH_USER:-postgres}
      POSTGRES_PASSWORD: ${DWH_PASSWORD:-postgres}
      POSTGRES_DB: ${DWH_DB:-dwh_prod}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dwh_network

  # --- Middleware: Kafka & Zookeeper ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: dwh_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - dwh_network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: dwh_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - dwh_network

  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.0
    container_name: dwh_schema_registry
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - dwh_network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: dwh_kafka_ui
    depends_on:
      - kafka
      - schema-registry
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    networks:
      - dwh_network

  # --- Orchestration: Dagster ---
  # Note: A full Dagster setup typically requires a custom image for user code.
  # For now, we provide the infrastructure for it.
  dagster_webserver:
    image: dagster/dagster-celery-k8s:1.5.0 # Using a full-featured image
    container_name: dwh_dagster_webserver
    entrypoint:
      - dagster-webserver
      - -h
      - 0.0.0.0
      - -p
      - "3000"
      - -w
      - /opt/dagster/app/workspace.yaml
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DWH_PG_HOST: postgres
    ports:
      - "3000:3000"
    volumes:
      - ./src/orchestration:/opt/dagster/app
      - dagster_home:/opt/dagster/dagster_home
    depends_on:
      - postgres
    networks:
      - dwh_network

  dagster_daemon:
    image: dagster/dagster-celery-k8s:1.5.0
    container_name: dwh_dagster_daemon
    entrypoint:
      - dagster-daemon
      - run
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
    volumes:
      - ./src/orchestration:/opt/dagster/app
      - dagster_home:/opt/dagster/dagster_home
    depends_on:
      - postgres
    networks:
      - dwh_network

  # --- Processing: Spark ---
  spark-master:
    image: bitnamilegacy/spark:3.4.1-debian-11-r87
    container_name: dwh_spark_master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - dwh_network
    volumes:
      - ./src/spark:/opt/bitnami/spark/app/src/spark

  spark-worker:
    image: bitnamilegacy/spark:3.4.1-debian-11-r87
    container_name: dwh_spark_worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    networks:
      - dwh_network
    volumes:
      - ./src/spark:/opt/bitnami/spark/app/src/spark

  # --- Data Ingestion: Airbyte ---
  # Airbyte is extremely heavy for a single compose. 
  # In a professional setup, it's often deployed separately.
  # We will provide a placeholder or link to the official installer.

networks:
  dwh_network:
    driver: bridge

volumes:
  postgres_data:
  dagster_home:
